<p-panel header="Buletin EDI" class="shadow-sm">
  @if (loading()) {
    <div class="flex justify-center py-8">
      <p-progressSpinner strokeWidth="6"></p-progressSpinner>
    </div>
  } @else {
    <form [formGroup]="form" class="grid gap-4">
      <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Nr. reg.</label>
            <input pInputText formControlName="nr" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Nume</label>
            <input pInputText formControlName="nume" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Prenume</label>
            <input pInputText formControlName="prenume" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Varsta</label>
            <input pInputText type="number" formControlName="virsta" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">CNP</label>
            <input pInputText formControlName="cnp" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Domiciliu</label>
            <textarea formControlName="domiciliu" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Diagnostic</label>
            <textarea formControlName="diagnostic" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Sedare</label>
            <input pInputText formControlName="sedareT" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Medicatie</label>
            <input pInputText formControlName="medicatie" class="w-full" />
          </div>
        </div>

        <div class="grid gap-4">
          <!-- <div>
            <label class="block mb-1">Sistem</label>
            <input pInputText formControlName="sistem" class="w-full" />
          </div>-->
          <div>
            <label class="block mb-1">Ileon terminal</label>
            <textarea formControlName="ileon" rows="2" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Cec</label>
            <textarea formControlName="cec" rows="2" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Ascendent</label>
            <textarea formControlName="ascendent" rows="2" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Transvers</label>
            <textarea formControlName="transvers" rows="2" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Biopsii L</label>
            <input pInputText formControlName="biopsiiL" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Biopsii N</label>
            <input pInputText type="number" formControlName="biopsiiN" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Nr. reg. AP</label>
            <input pInputText type="number" formControlName="nrap" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Tratament/Recomandari</label>
            <textarea formControlName="tratament" rows="4" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
        </div>

        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Descendent</label>
            <input pInputText formControlName="descendent" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Sigmoid</label>
            <input pInputText formControlName="sigmoid" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Rect</label>
            <input pInputText formControlName="rect" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Jonctiune ano-rectala</label>
            <input pInputText formControlName="jar" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Rezultat histo</label>
            <textarea formControlName="biopsiiR" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="block mb-1">Data</label>
              <input pInputText type="date" formControlName="data" class="w-full" />
            </div>
            <div>
              <label class="block mb-1">Ora</label>
              <input pInputText type="time" step="1" formControlName="ora" class="w-full" />
            </div>
          </div>
          <div>
            <label class="block mb-1">Medic</label>
            <p-select
              formControlName="medicId"
              [options]="medici()"
              optionLabel="medicName"
              optionValue="id"
              placeholder="Selecteaza medic"
              class="w-full"
            />
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <p-button label="Salvează" icon="pi pi-save" (onClick)="onSave()" />
        <a routerLink="/home/buletine-edi" class="p-button p-button-secondary">Inapoi</a>
      </div>
    </form>

    <ln-error-list [errors]="errors()" />
  }
</p-panel>
