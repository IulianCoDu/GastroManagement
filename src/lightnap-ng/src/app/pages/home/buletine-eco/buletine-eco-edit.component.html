<p-panel header="Buletin ECO" class="shadow-sm">
  @if (loading()) {
    <div class="flex justify-center py-8">
      <p-progressSpinner strokeWidth="6"></p-progressSpinner>
    </div>
  } @else {
    <form [formGroup]="form" class="grid gap-4">
      <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-4">
        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Nr. reg.</label>
            <input pInputText formControlName="nr" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Nume</label>
            <input pInputText formControlName="nume" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Prenume</label>
            <input pInputText formControlName="prenume" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Vârsta</label>
            <input pInputText type="number" formControlName="virsta" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Domiciliu</label>
            <input pInputText formControlName="domiciliu" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Telefon</label>
            <input pInputText formControlName="telefon" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">CNP</label>
            <input pInputText formControlName="cnp" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Diagnostic</label>
            <textarea formControlName="diagnostic" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <!-- <div>
          <label class="block mb-1">Seria CI</label>
          <input pInputText formControlName="seriaCs" />
        </div> -->
        </div>

        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Ficat</label>
            <textarea formControlName="ficat" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Colecist</label>
            <textarea formControlName="colecist" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Vena Portă</label>
            <input pInputText type="number" formControlName="vp" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Cai Biliare Principale</label>
            <input pInputText type="number" formControlName="cbp" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Vena Splenică</label>
            <input pInputText type="number" formControlName="vs" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">OGI</label>
            <input pInputText formControlName="ogi" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Prostată</label>
            <input pInputText formControlName="prostata" class="w-full" />
          </div>
        </div>

        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Pancreas</label>
            <textarea formControlName="pancreas" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Splina</label>
            <input pInputText formControlName="splina" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">Rinichi Drept</label>
            <textarea formControlName="rd" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Rinichi Stang</label>
            <textarea formControlName="rs" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
        </div>

        <div class="grid gap-4">
          <div>
            <label class="block mb-1">Vezica Urinara</label>
            <textarea formControlName="vu" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div>
            <label class="block mb-1">Observatii</label>
            <textarea formControlName="obs" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
          <div class="grid gap-4 md:grid-cols-2">
            <div>
              <label class="block mb-1">Data</label>
              <input pInputText type="date" formControlName="data" class="w-full" />
            </div>
            <div>
              <label class="block mb-1">Ora</label>
              <input pInputText type="time" step="1" formControlName="ora" class="w-full" />
            </div>
          </div>
          <div>
            <label class="block mb-1">Medic</label>
            <input pInputText formControlName="medic" class="w-full" />
          </div>
          <div>
            <label class="block mb-1">CE-US</label>
            <textarea formControlName="ceus" rows="3" class="p-inputtext p-component h-24 overflow-auto w-full"></textarea>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <p-button label="Salvează" icon="pi pi-save" (onClick)="onSave()" />
        <a routerLink="/home/buletine-eco" class="p-button p-button-secondary">Inapoi</a>
      </div>
    </form>

    <ln-error-list [errors]="errors()" />
  }
</p-panel>
