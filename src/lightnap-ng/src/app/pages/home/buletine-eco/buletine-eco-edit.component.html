<p-panel header="Buletin ECO" class="shadow-sm">
  @if (loading()) {
    <div class="flex justify-center py-8">
      <p-progressSpinner strokeWidth="6"></p-progressSpinner>
    </div>
  } @else {
    <form [formGroup]="form" class="grid gap-4">
      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <label class="block mb-1">Nr. reg.</label>
          <input pInputText formControlName="nr" />
        </div>
        <div>
          <label class="block mb-1">Nume</label>
          <input pInputText formControlName="nume" />
        </div>
        <div>
          <label class="block mb-1">Prenume</label>
          <input pInputText formControlName="prenume" />
        </div>
        <div>
          <label class="block mb-1">Vârsta</label>
          <input pInputText type="number" formControlName="virsta" />
        </div>
        <div>
          <label class="block mb-1">CNP</label>
          <input pInputText formControlName="cnp" />
        </div>
        <div>
          <label class="block mb-1">Seria CI</label>
          <input pInputText formControlName="seriaCs" />
        </div>
        <div>
          <label class="block mb-1">Domiciliu</label>
          <input pInputText formControlName="domiciliu" />
        </div>
        <div>
          <label class="block mb-1">Telefon</label>
          <input pInputText formControlName="telefon" />
        </div>
      </div>

      <div class="grid md:grid-cols-2 gap-4">
        <div>
          <label class="block mb-1">Diagnostic</label>
          <input pInputText formControlName="diagnostic" />
        </div>
        <div>
          <label class="block mb-1">Medic</label>
          <input pInputText formControlName="medic" />
        </div>
        <div>
          <label class="block mb-1">Ficat</label>
          <input pInputText formControlName="ficat" />
        </div>
        <div>
          <label class="block mb-1">Colecist</label>
          <input pInputText formControlName="colecist" />
        </div>
        <div>
          <label class="block mb-1">Pancreas</label>
          <input pInputText formControlName="pancreas" />
        </div>
        <div>
          <label class="block mb-1">Splină</label>
          <input pInputText formControlName="splina" />
        </div>
        <div>
          <label class="block mb-1">RD</label>
          <input pInputText formControlName="rd" />
        </div>
        <div>
          <label class="block mb-1">RS</label>
          <input pInputText formControlName="rs" />
        </div>
        <div>
          <label class="block mb-1">VU</label>
          <input pInputText formControlName="vu" />
        </div>
        <div>
          <label class="block mb-1">Prostată</label>
          <input pInputText formControlName="prostata" />
        </div>
        <div>
          <label class="block mb-1">OGI</label>
          <input pInputText formControlName="ogi" />
        </div>
        <div>
          <label class="block mb-1">Observații</label>
          <input pInputText formControlName="obs" />
        </div>
      </div>

      <div class="grid md:grid-cols-3 gap-4">
        <div>
          <label class="block mb-1">VP</label>
          <input pInputText type="number" formControlName="vp" />
        </div>
        <div>
          <label class="block mb-1">VS</label>
          <input pInputText type="number" formControlName="vs" />
        </div>
        <div>
          <label class="block mb-1">CBP</label>
          <input pInputText type="number" formControlName="cbp" />
        </div>
        <div>
          <label class="block mb-1">Data</label>
          <input pInputText formControlName="data" />
        </div>
        <div>
          <label class="block mb-1">Ora</label>
          <input pInputText formControlName="ora" />
        </div>
        <div>
          <label class="block mb-1">CEUS</label>
          <input pInputText formControlName="ceus" />
        </div>
      </div>

      <div class="flex items-center gap-2">
        <p-button label="Salvează" icon="pi pi-save" (onClick)="onSave()" />
        <a routerLink="/home/buletine-eco" class="p-button p-button-secondary">Înapoi</a>
      </div>
    </form>

    <ln-error-list [errors]="errors()" />
  }
</p-panel>
