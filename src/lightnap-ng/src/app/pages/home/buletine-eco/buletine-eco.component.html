<p-panel header="Buletine ECO" class="shadow-sm">
  @if (loading()) {
    <div class="flex justify-center py-8">
      <p-progressSpinner strokeWidth="6"></p-progressSpinner>
    </div>
  } @else {
    <div class="flex flex-col gap-3 mb-4">
      <p-button label="Adauga" icon="pi pi-plus" routerLink="/home/buletine-eco/new" />
      <div class="flex items-center gap-2 text-sm text-slate-600">Cauta:</div>
      <div [formGroup]="form" class="gastro-controls">
        <input pInputText placeholder="Nr" formControlName="nr" />
        <input pInputText placeholder="Nume" formControlName="nume" />
        <input pInputText placeholder="Prenume" formControlName="prenume" />
        <input pInputText placeholder="CNP" formControlName="cnp" />
      </div>
    </div>

    <div class="gastro-table-wrap">
      <p-table
        [value]="filteredRecords()"
        [columns]="columns"
        [paginator]="true"
        [rows]="10"
        [rowsPerPageOptions]="[10, 30, 50]"
        [scrollable]="true"
        scrollDirection="both"
        [scrollHeight]="tableScrollHeight"
        class="min-w-full shadow-inner"
        [tableStyle]="{ 'min-width': '5000px' }"
      >
        <ng-template #header let-columns>
          <tr>
            <th pFrozenColumn class="gastro-actions-col">
              <div class="flex items-center gap-1">
                <i class="pi pi-pencil"></i>
                <i class="pi pi-trash"></i>
              </div>
            </th>
            <th *ngFor="let column of columns" class="text-left uppercase text-xs tracking-wider text-slate-500">
              {{ column.header }}
            </th>
          </tr>
        </ng-template>

        <ng-template #body let-rowData let-columns="columns" let-rowIndex="rowIndex">
          <tr [ngClass]="rowIndex % 2 === 0 ? 'gastro-row-even' : 'gastro-row-odd'">
            <td pFrozenColumn class="gastro-actions-col">
              <div class="flex items-center gap-1">
                <p-button
                  icon="pi pi-pencil"
                  severity="warn"
                  size="small"
                  class="p-button-text p-button-sm"
                  title="Editeaza buletin"
                  [routerLink]="['/home/buletine-eco', rowData.id]"
                />
                <ln-confirm-popup [key]="'buletin-eco-' + rowData.id" confirmSeverity="danger" confirmIcon="pi pi-trash" confirmText="Sterge" />
                <p-button
                  icon="pi pi-trash"
                  severity="danger"
                  size="small"
                  class="p-button-text p-button-sm"
                  title="Sterge buletin"
                  (onClick)="deleteRecord($event, rowData.id)"
                />
              </div>
            </td>
            <td *ngFor="let column of columns" class="border-b">
              {{ rowData[column.field] ?? "-" }}
            </td>
          </tr>
        </ng-template>

        <ng-template #emptymessage>
          <tr>
            <td [attr.colspan]="columns.length + 1" class="text-center py-6 text-sm text-slate-500">
              Nu exista inregistrari care sa indeplineasca filtrele.
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <ln-gastro-charts [records]="filteredRecords()" [settingsKey]="chartSettingsKey" [defaultCharts]="defaultCharts" />

    <ln-error-list [errors]="errors()" />
  }
</p-panel>
