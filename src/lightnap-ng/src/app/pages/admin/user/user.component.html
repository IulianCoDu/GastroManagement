<ln-api-response [apiResponse]="user$()" errorMessage="Eroare la incarcarea utilizatorului" loadingMessage="Se incarca utilizatorul...">
  <ng-template #success let-userAny>
    @let user = asUser(userAny);

    <p-panel>
      <ng-template #header>
        <div class="p-panel-body flex justify-between w-full">
          <div class="flex flex-col gap-1">
            <div class="p-panel-title">
              {{ user.userName }}
              @if (user.lockoutEnd) {
                <p-tag class="ml-1" severity="danger" value="Blocat" />
              }
            </div>
            <div class="p-panel-subtitle">{{ user.email }}</div>
          </div>
            <div class="flex gap-1">
            <ln-confirm-popup key="lock" confirmSeverity="danger" confirmIcon="pi pi-lock" />
            <p-button severity="danger" title="Blocheaza contul utilizatorului" (onClick)="lockUserAccount($event)" icon="pi pi-lock" [hidden]="user.lockoutEnd" />
            <ln-confirm-popup key="unlock" confirmSeverity="success" confirmIcon="pi pi-unlock" />
            <p-button
              severity="success"
              title="Deblocheaza contul utilizatorului"
              (onClick)="unlockUserAccount($event)"
              icon="pi pi-unlock"
              [hidden]="!user.lockoutEnd"
            />
            <ln-confirm-popup key="delete" />
            <p-button severity="danger" title="Sterge utilizator" (onClick)="deleteUser($event)" icon="pi pi-trash" />
          </div>
        </div>
      </ng-template>

      <p-tabs value="profile">
        <p-tablist>
          <p-tab value="profile">Profil</p-tab>
          <p-tab value="roles">Roluri</p-tab>
          <p-tab value="claims">Permisiuni</p-tab>
        </p-tablist>
        <p-tabpanels>
          <p-tabpanel value="profile">
            <user-profile [user]="user" />
          </p-tabpanel>
          <p-tabpanel value="roles">
            <ln-api-response [apiResponse]="userRoles$()" errorMessage="Eroare la incarcarea rolurilor utilizatorului" loadingMessage="Se incarca rolurile utilizatorului...">
              <ng-template #success let-userRolesAny>
                @let userRoles = asUserRoles(userRolesAny);

                <user-roles [userRoles]="userRoles ?? []" (addRole)="addRole($event)" (removeRole)="removeRole($event)" />
              </ng-template>
            </ln-api-response>
          </p-tabpanel>
          <p-tabpanel value="claims">
            <user-claims [userId]="user.id" />
          </p-tabpanel>
        </p-tabpanels>
      </p-tabs>

      <ln-error-list [errors]="errors()" />
    </p-panel>
  </ng-template>
  <ng-template #null>
    <p>Acest utilizator nu a fost gasit.</p>
  </ng-template>
</ln-api-response>
