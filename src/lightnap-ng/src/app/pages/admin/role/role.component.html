<ln-api-response [apiResponse]="roleWithUsers$()" errorMessage="Eroare la incarcarea rolului" loadingMessage="Se incarca rolul...">
  <ng-template #success let-roleWithUsersAny>
    @let roleWithUsers = asRoleWithUsers(roleWithUsersAny);

    <p-panel header="Gestioneaza utilizatorii din rol: {{ roleWithUsers.role.displayName }}">
      <p-table [value]="roleWithUsers.users">
        <ng-template #header>
          <tr>
            <th><i class="pi pi-trash"></i></th>
            <th class="whitespace-nowrap">Nume utilizator</th>
            <th width="100%">Email</th>
          </tr>
        </ng-template>
        <ng-template #body let-userAny>
          @let user = asAdminUser(userAny);

          <tr>
            <td>
              <ln-confirm-popup [key]="user.id" confirmStyleClass="p-button-danger" />
              <p-button severity="danger" icon="pi pi-trash" title="Elimina utilizatorul din rol" (onClick)="removeUserFromRole($event, user.id)" />
            </td>
            <td>
              <a [routerLink]="'admin-user' | route: user.userName"> {{ user.userName }}</a>
            </td>
            <td>
              <a href="mailto:{{ user.email }}"> {{ user.email }}</a>
            </td>
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <tr>
            <td colspan="100%">Rolul nu are niciun membru.</td>
          </tr>
        </ng-template>
      </p-table>

      <form [formGroup]="form" class="flex gap-2 my-3" (ngSubmit)="addUserToRole()">
        <ln-user-picker formControlName="userId" />
        <p-button type="submit" label="Adauga utilizator" icon="pi pi-plus" [disabled]="!form.valid" />
      </form>

      <ln-error-list [errors]="errors()" />
    </p-panel>
  </ng-template>
</ln-api-response>
