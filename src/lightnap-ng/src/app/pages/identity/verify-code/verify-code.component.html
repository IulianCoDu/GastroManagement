<ln-branded-card>
  <span title>Verificare in doi pasi</span>
  <span subtitle>Introduceti codul de securitate pentru a continua.</span>

  <div class="w-72">
    <div class="flex flex-col">
      <form [formGroup]="form" (ngSubmit)="(form.valid)" autocomplete="off">
        <div class="flex flex-col gap-5">
          <div class="flex justify-center">
            <p-inputotp formControlName="code" [length]="6" />
          </div>

          <div class="flex gap-1">
            <p-checkbox inputId="rememberMe" formControlName="rememberMe" [binary]="true" />
            <label for="rememberMe">Tine-ma minte</label>
          </div>

          <ln-error-list [errors]="errors()" />
        </div>

        <p-button type="submit" label="Verifica" class="w-full" [disabled]="!form.valid" pRipple (onClick)="onVerifyClicked()" />
      </form>

      <div class="mt-6 flex flex-wrap gap-4">
        <a [routerLink]="'login' | route" class="ml-auto">Inapoi la autentificare</a>
      </div>
    </div>
  </div>
</ln-branded-card>
