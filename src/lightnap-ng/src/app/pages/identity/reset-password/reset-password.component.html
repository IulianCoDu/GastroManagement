<ln-branded-card>
  <span title>Ai uitat parola?</span>
  <span subtitle>Introduceti email-ul pentru a reseta parola</span>

  <form [formGroup]="form" (ngSubmit)="resetPassword()" autocomplete="off">
    <div class="w-96">
      <div class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="email" class="text-xl">Email</label>
          <input id="email" type="text" placeholder="Adresa de email" pInputText formControlName="email" />
        </div>

        <ln-error-list [errors]="errors()" />
      </div>
      <p-button type="submit" label="Reseteaza parola" styleClass="w-full text-xl" [disabled]="!form.valid" pRipple />

      <div class="mt-6">
        <a [routerLink]="'login' | route" class="ml-auto">Inapoi la autentificare</a>
      </div>
    </div>
  </form>
</ln-branded-card>
