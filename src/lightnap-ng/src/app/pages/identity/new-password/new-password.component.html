<ln-branded-card>
  <span title>Parola noua</span>
  <span subtitle>Introduceti noua parola mai jos</span>

  <form [formGroup]="form" (ngSubmit)="newPassword()" autocomplete="off">
    <div class="w-96">
      <div class="flex flex-col gap-5">
        <div class="flex flex-col gap-2">
          <label for="password" class="text-xl">Parola</label>
          <p-password formControlName="password" styleClass="w-full" inputStyleClass="w-full" placeholder="Parola" [toggleMask]="true" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="confirmPassword" class="text-xl">Confirma parola</label>
          <p-password
            formControlName="confirmPassword"
            styleClass="w-full"
            inputStyleClass="w-full"
            placeholder="Confirma parola"
            [toggleMask]="true"
            [feedback]="false"
          />
        </div>

        <div class="flex gap-2">
          <p-checkbox inputId="rememberMe" formControlName="rememberMe" [binary]="true" />
          <label for="rememberMe">Tine-ma minte</label>
        </div>

        <ln-error-list [errors]="errors()" />
      </div>
      <p-button type="submit" label="Seteaza parola" styleClass="w-full" [disabled]="!form.valid" />
    </div>
  </form>
  <div class="mt-6 flex flex-wrap gap-4">
    <a [routerLink]="'login' | route" class="ml-auto">Inapoi la autentificare</a>
  </div>
</ln-branded-card>
