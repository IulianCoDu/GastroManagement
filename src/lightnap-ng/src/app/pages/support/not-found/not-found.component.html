<ln-branded-card>
  <span title>Pagina negasita</span>
  <span subtitle>Resursa solicitata nu este disponibila.</span>

  <div class="flex flex-col items-center">
    <span class="text-blue-500 font-bold text-3xl">404</span>
    <h1 class="text-surface-900 dark:text-surface-0 font-bold text-3xl lg:text-5xl mb-2">Pagina negasita</h1>
    <div class="text-surface-600 dark:text-surface-200 mb-8">Resursa solicitata nu este disponibila.</div>
    <a [routerLink]="['/']" class="w-full flex items-center py-8 border-surface-300 dark:border-surface-500 border-b">
      <span class="flex justify-center items-center bg-cyan-400 rounded-border" style="height: 3.5rem; width: 3.5rem">
        <i class="text-surface-50 dark:text-surface-800 pi pi-fw pi-table text-2xl"></i>
      </span>
      <span class="ml-6 flex flex-col">
        <span class="text-surface-900 dark:text-surface-0 lg:text-xl font-medium mb-0 block">Intrebari frecvente</span>
        <span class="text-surface-600 dark:text-surface-200 lg:text-xl">Gasiti raspunsuri la intrebarile frecvente.</span>
      </span>
    </a>
    <a [routerLink]="['/']" class="w-full flex items-center py-8 border-surface-300 dark:border-surface-500 border-b">
      <span class="flex justify-center items-center bg-orange-400 rounded-border" style="height: 3.5rem; width: 3.5rem">
        <i class="pi pi-fw pi-question-circle text-surface-50 dark:text-surface-800 text-2xl"></i>
      </span>
      <span class="ml-6 flex flex-col">
        <span class="text-surface-900 dark:text-surface-0 lg:text-xl font-medium mb-0">Centrul de ajutor</span>
        <span class="text-surface-600 dark:text-surface-200 lg:text-xl">Resurse de ajutor disponibile.</span>
      </span>
    </a>
    <a [routerLink]="['/']" class="w-full flex items-center mb-8 py-8 border-surface-300 dark:border-surface-500 border-b">
      <span class="flex justify-center items-center bg-indigo-400 rounded-border" style="height: 3.5rem; width: 3.5rem">
        <i class="pi pi-fw pi-unlock text-surface-50 dark:text-surface-800 text-2xl"></i>
      </span>
      <span class="ml-6 flex flex-col">
        <span class="text-surface-900 dark:text-surface-0 lg:text-xl font-medium mb-0">Manager de permisiuni</span>
        <span class="text-surface-600 dark:text-surface-200 lg:text-xl">Gestionati permisiunile de acces.</span>
      </span>
    </a>
  </div>
</ln-branded-card>
