<p-panel [header]="title" class="shadow-sm">
  @if (loading) {
    <div class="flex justify-center py-8">
      <p-progressSpinner strokeWidth="6"></p-progressSpinner>
    </div>
  } @else {
    <p-table
      [value]="data"
      [columns]="columns"
      scrollable
      scrollDirection="both"
      [scrollHeight]="scrollHeight"
      class="min-w-full shadow-inner"
      [tableStyle]="{ 'min-width': '1600px' }"
    >
      <ng-template pTemplate="header" let-columns>
        <tr>
          <th *ngFor="let column of columns" class="text-left uppercase text-xs tracking-wider text-slate-500">
            {{ column.header }}
          </th>
        </tr>
      </ng-template>
      <ng-template pTemplate="body" let-rowData let-columns="columns" let-rowIndex="rowIndex">
        <tr [ngClass]="rowIndex % 2 === 0 ? 'gastro-row-even' : 'gastro-row-odd'">
          <td *ngFor="let column of columns" class="border-b">
            {{ formatCell(column.field, rowData[column.field]) }}
          </td>
        </tr>
      </ng-template>
      <ng-template pTemplate="emptymessage" let-columns>
        <tr>
          <td [attr.colspan]="columns.length" class="text-center py-6 text-sm text-slate-500">
            No records available.
          </td>
        </tr>
      </ng-template>
    </p-table>
  }
</p-panel>
